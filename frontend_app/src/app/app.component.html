<!-- Dashboard layout with sidebar and main content area per Device Portal Dashboard Design Notes -->

<div class="dashboard-root">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <span class="sidebar-logo">🟢</span>
      <span class="sidebar-title" *ngIf="!sidebarCollapsed">Device Portal</span>
    </div>

    <nav class="sidebar-nav">
      <ng-container *ngFor="let nav of sidebarNav">
        <button
          class="sidebar-btn"
          [ngStyle]="{'background': nav.bgColor}"
          [title]="nav.label"
          (click)="selectSection(nav.section)"
          [class.active]="selectedSection === nav.section"
          [attr.aria-current]="selectedSection === nav.section ? 'page' : null">
          <span class="sidebar-icon" [innerHTML]="nav.icon"></span>
          <span *ngIf="!sidebarCollapsed" class="sidebar-label">{{nav.label}}</span>
        </button>
      </ng-container>
    </nav>

    <div style="flex:0 0 auto;">
      <div class="sidebar-chevron chevron-up" tabindex="0" role="button" aria-label="Scroll up" (click)="scrollSidebar($event)" (keydown.enter)="scrollSidebar($event)">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 12l5-5 5 5" stroke="#888" stroke-width="2" fill="none"></path></svg>
      </div>
      <div class="sidebar-chevron chevron-down" tabindex="0" role="button" aria-label="Scroll down" (click)="scrollSidebar($event)" (keydown.enter)="scrollSidebar($event)">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5" stroke="#888" stroke-width="2" fill="none"></path></svg>
      </div>
    </div>

    <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16"><path [attr.d]="sidebarCollapsed ? 'M4 4l8 4-8 4z':'M12 12L4 8l8-4z'" fill="#888"/></svg>
    </button>
  </aside>

  <main class="dashboard-main">
    <section class="dashboard-grid">
      <!-- Device Info Card -->
      <article class="dashboard-card card-device-info">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.device"></span>
          <span class="card-title">Device Information</span>
        </div>
        <div class="card-content">
          <div class="card-row"><span>Status:</span>
            <span class="inline-status ok">Online</span>
          </div>
          <div class="card-row"><span>Device Name:</span> Epsilon-3000</div>
          <div class="card-row"><span>IP:</span> 192.168.1.42</div>
          <div class="card-row"><span>Serial:</span> 00:1A:2B:3C:4D:5E</div>
        </div>
      </article>

      <!-- Performance Section -->
      <article class="dashboard-card card-perf" style="grid-column: span 2;">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.cpu"></span>
          <span class="card-title">CPU Usage</span>
          <span class="card-value accent-cyan">43%</span>
        </div>
        <div class="card-content">
          <div class="progressbar" [style.width.%]="43"></div>
        </div>
      </article>
      <article class="dashboard-card card-perf" style="grid-column: span 1;">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.ram"></span>
          <span class="card-title">Memory</span>
          <span class="card-value accent-cyan">3.1GB / 8GB</span>
        </div>
        <div class="card-content">
          <div class="progressbar" [style.width.%]="39"></div>
        </div>
      </article>
      <article class="dashboard-card card-perf">
        <div class="card-header small">
          <span class="card-icon" [innerHTML]="icons.temp"></span>
          <span class="card-title">Temp</span>
          <span class="card-value accent-cyan">57°C</span>
        </div>
        <div class="card-content compact"></div>
      </article>
      <article class="dashboard-card card-perf">
        <div class="card-header small">
          <span class="card-icon" [innerHTML]="icons.uptime"></span>
          <span class="card-title">Uptime</span>
          <span class="card-value accent-cyan">3d 6h</span>
        </div>
        <div class="card-content compact"></div>
      </article>

      <!-- Diagnostics -->
      <article class="dashboard-card card-diagnostics">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.diagnostics"></span>
          <span class="card-title">Diagnostics</span>
        </div>
        <div class="card-content pills">
          <button class="pill-btn accent-pink" tabindex="0" role="button">
            <span class="pill-icon" [innerHTML]="icons.upload"></span>
            Upload Speed: <strong>9 Mbps</strong>
          </button>
          <button class="pill-btn accent-pink" tabindex="0" role="button">
            <span class="pill-icon" [innerHTML]="icons.download"></span>
            Download Speed: <strong>37 Mbps</strong>
          </button>
        </div>
      </article>

      <!-- Device Control -->
      <article class="dashboard-card card-ctrl">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.control"></span>
          <span class="card-title">Device Control</span>
        </div>
        <div class="card-content pills">
          <button class="large-btn accent-orange" tabindex="0" role="button">
            <span class="btn-icon" [innerHTML]="icons.reboot"></span>
            Reboot
          </button>
          <button class="large-btn accent-gold" tabindex="0" role="button">
            <span class="btn-icon" [innerHTML]="icons.reset"></span>
            Factory Reset
          </button>
        </div>
      </article>

      <!-- Connected Clients -->
      <article class="dashboard-card card-clients">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.clients"></span>
          <span class="card-title">Connected Clients</span>
        </div>
        <div class="card-content">
          <div class="client-count accent-light-green">5</div>
          <div class="client-desc">Devices connected</div>
        </div>
      </article>

      <!-- Device Log -->
      <article class="dashboard-card card-log">
        <div class="card-header">
          <span class="card-icon" [innerHTML]="icons.log"></span>
          <span class="card-title">Device Log</span>
        </div>
        <div class="card-content pills">
          <button class="pill-btn accent-olive" tabindex="0" role="button">
            <span class="pill-icon" [innerHTML]="icons.downloadAll"></span>
            Download All
          </button>
          <button class="pill-btn accent-olive" tabindex="0" role="button">
            <span class="pill-icon" [innerHTML]="icons.downloadRecent"></span>
            Download Recent
          </button>
        </div>
      </article>
    </section>
  </main>
</div>
